[project]
name = "fi-energy-mle-selector"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: exercises live external APIs and needs credentials from .env",
]
