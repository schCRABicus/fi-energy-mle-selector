[project]
name = "fi-energy-mle-selector"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "holidays>=0.109",
    "httpx>=0.28.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fi_energy"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises live external APIs and needs credentials from .env",
]
